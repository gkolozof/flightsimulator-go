  <script>
    (function(){
      var imgs=[].slice.call(document.querySelectorAll('.thumbs img'));
      var seen={};
      imgs=imgs.filter(function(img){
        var k=img.getAttribute('src');
        if(seen[k]){ img.remove(); return false; }
        seen[k]=1; return true;
      });
      var main=document.getElementById('mainPhoto');
      var i=0;
      function show(n){
        if(!imgs.length) return;
        i=(n+imgs.length)%imgs.length;
        main.src=imgs[i].src;
        imgs.forEach(function(t,k){ t.classList.toggle('on', k===i); });
      }
      imgs.forEach(function(t,k){ t.addEventListener('click', function(){ show(k); }); });
      var prev=document.querySelector('.g-prev'), next=document.querySelector('.g-next');
      if(imgs.length<2){
        if(prev) prev.hidden=true;
        if(next) next.hidden=true;
        var box=document.querySelector('.thumbs');
        if(box) box.hidden=true;
      } else {
        prev.addEventListener('click', function(){ show(i-1); });
        next.addEventListener('click', function(){ show(i+1); });
      }
      show(0);
      document.getElementById('buyBtn').addEventListener('click', function(){
        var f=document.getElementById('orderForm');
        f.hidden=false;
        f.scrollIntoView({behavior:'smooth', block:'start'});
      });
    })();
  </script>
